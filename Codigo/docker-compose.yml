services:
  db:
    image: postgres:16
    container_name: mobu_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mobu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobu_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mobu}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mobu_pg:/var/lib/postgresql/data

volumes:
  mobu_pg:
